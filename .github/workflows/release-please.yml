on:
  push:
    branches:
      - main

permissions: {}

name: release-please

jobs:
  release-please:
    permissions:
      contents: write
      pull-requests: write
      issues: write
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          # Use a PAT so release tag pushes trigger downstream workflows.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          release-type: simple
